<script>
// ======================================================================= tiện ích
Chart.defaults.font.family = 'Calibri, "Segoe UI", Arial, sans-serif';
Chart.defaults.color = '#595959';
Chart.defaults.animation = false;
Chart.defaults.plugins.legend.labels.boxWidth = 12;
const C = { navy: '#1F3864', blue: '#4472C4', orange: '#ED7D31', red: '#C00000', green: '#2E7D32', grey: '#A5A5A5', gold: '#FFC000', purple: '#7A5195', teal: '#138A8A' };
const REG = { 'Đông Nam': C.blue, 'Miền Nam': C.green, 'Trung Tây': C.orange, 'Đông Bắc': C.red, 'Miền Bắc': C.grey };
const GH = 'https://github.com/Thanh-2312/OlistDashboard/blob/main/mo_rong/';
const nf = (x, d = 0) => (x == null || Number.isNaN(+x)) ? '–' : (+x).toLocaleString('vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (x, d = 0) => nf(x * 100, d) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const main = document.getElementById('main');
let charts = [];

function title(h, sub) { main.append(el('div', 'title', `<h2>${esc(h)}</h2>${sub ? `<span>${esc(sub)}</span>` : ''}`)); }
function kpis(list) { const k = el('div', 'kpis'); list.forEach(([v, l]) => k.append(el('div', 'kpi', `<div class="v">${v}</div><div class="l">${l}</div>`))); main.append(k); }
function grid() { const g = el('div', 'grid'); main.append(g); return g; }
function card(g, h, wide) { const c = el('div', 'card' + (wide ? ' wide' : '')); if (h) c.append(el('h3', '', esc(h))); g.append(c); return c; }
function insight(c, msg) { c.append(el('div', 'insight', `<b>Ý nghĩa →</b> ${msg}`)); }
function table(c, head, rows, numCols = [], cls) {
  const w = el('div', 'scroll'), t = el('table');
  t.append(el('tr', '', head.map((h, j) => `<th class="${numCols.includes(j) ? 'n' : ''}">${esc(h)}</th>`).join('')));
  rows.forEach((r, i) => t.append(el('tr', '', r.map((v, j) => `<td class="${numCols.includes(j) ? 'n' : ''} ${cls ? cls(i, j, v) : ''}">${v}</td>`).join(''))));
  w.append(t); c.append(w);
}
function chart(c, cfg, tall) {
  const box = el('div', 'chart' + (tall ? ' tall' : '')), cv = el('canvas');
  box.append(cv); c.append(box);
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false }, cfg.options || {});
  charts.push(new Chart(cv, cfg));
}

// ======================================================================= mô hình cảm xúc chạy trong trình duyệt
const M = MR.model, VOC = new Map(Object.entries(M.vocab)), STOPS = new Set(M.stop);
const GLOSS = Object.fromEntries(MR.ai.words.map(r => [r[1], r[3]]));
function normText(s) {   // giống olist_utils.norm_text: bỏ nháy, bỏ dấu, chữ thường, chỉ giữ a-z 0-9
  return s.replace(/['’`´]/g, '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}
function analyze(text) {
  const toks = normText(text).split(' ').filter(w => w.length >= 2 && !STOPS.has(w));
  const grams = toks.concat(toks.slice(0, -1).map((w, i) => w + ' ' + toks[i + 1]));
  const cnt = new Map();
  grams.forEach(g => { if (VOC.has(g)) cnt.set(g, (cnt.get(g) || 0) + 1); });
  const w = [...cnt].map(([g, k]) => [g, (1 + Math.log(k)) * VOC.get(g)[0]]);
  const nrm = Math.sqrt(w.reduce((s, [, x]) => s + x * x, 0)) || 1;
  const contrib = w.map(([g, x]) => [g, VOC.get(g)[1] * x / nrm]);
  const z = M.b + contrib.reduce((s, [, x]) => s + x, 0);
  return { p: 1 / (1 + Math.exp(-z)), contrib, known: cnt.size, norm: toks.join(' ') };
}
const SELFTEST = M.examples.every(([t, , p]) => Math.abs(analyze(t).p - p) < 1e-3);
console.log('Kiểm tra mô hình JS so với Python:', SELFTEST ? 'khớp' : 'LỆCH', M.examples.map(([t, , p]) => [p, +analyze(t).p.toFixed(4)]));

// ======================================================================= các trang
const PAGES = [
  ['Tổng quan', pageOverview], ['Lakehouse · API', pageApi], ['Lakehouse · JSON lồng nhau', pageJson], ['Lakehouse · Văn bản', pageText],
  ['AI · Thử đọc cảm xúc', pageSentiment], ['AI · Chủ đề & dự báo trễ', pageThemes], ['Mã nguồn & dữ liệu', pageCode]];

function pageOverview() {
  title('Hai hướng mở rộng đi sâu', 'Hướng 1: Lakehouse xử lý dữ liệu bán cấu trúc & không cấu trúc (N6) · Hướng 2: Ứng dụng AI trong khai thác dữ liệu (N7)');
  const ai = MR.ai, top = ai.lift[0];
  kpis([['3 API', `dữ liệu thật · ${nf(MR.api.reduce((s, r) => s + r[3], 0))} bản ghi JSON`], [nf(MR.rec[0][2]), 'đơn hàng dạng tài liệu JSON lồng nhau'],
        ['+' + MR.added.length + ' trường', 'Delta tự thêm khi API đổi phiên bản'], [nf(MR.tprofile[0][1]), 'bình luận được làm sạch, che dữ liệu cá nhân'],
        [pct(ai.metrics[3][1]), 'AI đọc đúng cảm xúc (dữ liệu chưa thấy)'], ['×' + nf(top[7], 1), 'đơn rủi ro cao nhất trễ hơn mức chung']]);
  const g = grid();
  const c = card(g, 'Kiến trúc mở rộng: 10 job L13 → L22 nối tiếp lakehouse 12 job của N5', true);
  const ST = [['Landing', '#FDF1E4', 'File JSON gốc từ 3 API · 25 file JSON Lines đơn hàng'], ['Bronze', '#EAF2FB', 'Lưu nguyên văn · nạp lũy đẳng (MERGE) · mỗi lần nạp một phiên bản'],
              ['Silver', '#E4F4F4', 'Hợp đồng dữ liệu v1/v2 · cách ly dòng lỗi · che dữ liệu cá nhân'], ['Gold', '#E8F5EC', 'Mart tỷ giá, dân số · văn bản + chỉ mục từ · kết quả AI'],
              ['Publish', '#FBEAEA', 'Parquet cho Power BI (cùng cách job L12)']];
  const f = el('div', 'flow');
  ST.forEach(([h, bg, t], i) => { f.append(el('div', 'st', `<b>${h}</b>${t}`)); f.lastChild.style.background = bg; if (i < ST.length - 1) f.append(el('div', 'ar', '→')); });
  c.append(f);
  c.append(el('div', 'ai-box', '<b>AI (notebook N7)</b> đọc Silver / Gold → mô hình cảm xúc, chủ đề phàn nàn, rủi ro giao trễ → <b>ghi ngược vào Gold</b> (gold/review_ai, gold/order_late_risk)'));
  const c2 = card(g, 'Vấn đề → giải pháp trong lakehouse → bằng chứng đo được', true);
  table(c2, ['Loại dữ liệu', 'Vấn đề', 'Giải pháp lakehouse', 'Bằng chứng'], MR.caps.map(r => r.map(esc)));
  const c3 = card(g, 'Ba bài toán AI – kết quả trên dữ liệu chưa từng thấy', true);
  table(c3, ['Bài toán', 'Phương pháp', 'Kết quả đo được', 'Giá trị nghiệp vụ'], ai.summary.map(r => r.map(esc)));
}

function pageApi() {
  title('Dữ liệu bán cấu trúc từ 3 API công khai của Brazil', 'API → Landing (file gốc) → Bronze (nguyên văn, MERGE lũy đẳng) → Silver (ép kiểu) → Gold (nối với kho)');
  const g = grid();
  let c = card(g, 'Các lời gọi API (lưu nguyên văn vào vùng hạ cánh)');
  table(c, ['Nguồn', 'Dữ liệu', 'Bản ghi', 'KB'], MR.api.map(r => [esc(r[0]), `<a href="${esc(r[5])}" target="_blank" rel="noopener">${esc(r[2])}</a>`, nf(r[3]), nf(r[4], 1)]), [2, 3]);
  insight(c, `nạp lại cùng ${MR.idem.length} file: thêm <b>${MR.idem.reduce((s, r) => s + r[3], 0)}</b> dòng – MERGE theo mã băm file nên chạy lại không trùng.`);
  c = card(g, '"Bẫy" dữ liệu gặp thật và cách xử lý ở Silver');
  table(c, ['API', 'Vấn đề', 'Số lượng', 'Xử lý'], MR.quirks.map(r => [esc(r[0]), esc(r[1]), nf(r[2]), esc(r[3])]), [2]);
  c = card(g, 'Tỷ giá USD/BRL hằng ngày – API Ngân hàng Trung ương Brazil (SGS 1)', true);
  chart(c, { type: 'line', data: { labels: MR.fx.d, datasets: [{ label: 'BRL cho 1 USD', data: MR.fx.r, borderColor: C.blue, pointRadius: 0, borderWidth: 1.6 }] },
             options: { plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } }, scales: { x: { ticks: { maxTicksLimit: 14 } } } } });
  insight(c, `ngày nghỉ không có tỷ giá (${nf(MR.fx.filled.reduce((a, b) => a + b, 0))} ngày) được lấy tỷ giá ngày làm việc trước đó. Tỷ giá bình quân T1–8: 2017 = ${nf(MR.rate[2017], 2)}, 2018 = ${nf(MR.rate[2018], 2)} → BRL mất giá ${pct(MR.rate[2018] / MR.rate[2017] - 1)}.`);
  c = card(g, 'Tăng trưởng doanh thu T1–8/2018 so cùng kỳ: BRL và USD');
  chart(c, { type: 'bar', data: { labels: MR.growth.map(r => 'Đo bằng ' + r[0]), datasets: [{ data: MR.growth.map(r => r[3] * 100), backgroundColor: [C.blue, C.orange] }] },
             options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: x => '+' + nf(x.raw) + '%' } } }, scales: { y: { ticks: { callback: v => v + '%' } } } } });
  insight(c, `quy đổi từng dòng bán theo tỷ giá <b>đúng ngày đặt hàng</b>: +${pct(MR.growth[0][3])} theo BRL nhưng chỉ +${pct(MR.growth[1][3])} theo USD.`);
  c = card(g, 'Doanh thu theo tháng: BRL và quy đổi USD');
  chart(c, { type: 'line', data: { labels: MR.monthly.map(r => r[0]), datasets: [
    { label: 'Doanh thu (BRL)', data: MR.monthly.map(r => r[1]), borderColor: C.blue, backgroundColor: C.blue, yAxisID: 'y' },
    { label: 'Doanh thu (USD)', data: MR.monthly.map(r => r[2]), borderColor: C.orange, backgroundColor: C.orange, yAxisID: 'y1' }] },
    options: { interaction: { mode: 'index', intersect: false }, scales: { y: { ticks: { callback: v => nf(v / 1e6, 1) + ' tr' } }, y1: { position: 'right', grid: { display: false }, ticks: { callback: v => nf(v / 1e6, 1) + ' tr' } } } } });
  c = card(g, `Số đơn trên 100.000 dân theo bang (01/2017–08/2018) – dân số từ API IBGE · cả nước: ${nf(MR.nat)}`, true);
  const s = MR.states.slice().sort((a, b) => b[6] - a[6]);
  chart(c, { type: 'bar', data: { labels: s.map(r => r[0] + ' – ' + r[1]), datasets: [{ data: s.map(r => r[6]), backgroundColor: s.map(r => REG[r[2]]) }] },
             options: { indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { callbacks: { label: x => {
               const r = s[x.dataIndex]; return [`${nf(r[6], 1)} đơn / 100.000 dân (${r[2]})`, `Dân số ${nf(r[3])} · ${nf(r[5])} đơn · chỉ số ${nf(r[8])} (cả nước = 100)`]; } } } } } }, true);
  insight(c, 'màu theo vùng: <span style="color:' + C.blue + '">■</span> Đông Nam <span style="color:' + C.green + '">■</span> Miền Nam <span style="color:' + C.orange + '">■</span> Trung Tây <span style="color:' + C.red + '">■</span> Đông Bắc <span style="color:' + C.grey + '">■</span> Miền Bắc. São Paulo gấp đôi cả nước, Amazonas chỉ ' + nf(s[s.length - 1][6], 1) + ' – dư địa mở rộng ở Bắc / Đông Bắc.');
  c = card(g, 'Kiểm tra chất lượng tên thành phố bằng danh mục 5.570 thành phố IBGE');
  table(c, ['Nguồn', 'Số dòng', 'Tên khác nhau', 'Khớp IBGE', 'Tỷ lệ'], MR.city.map(r => [esc(r[0]), nf(r[1]), nf(r[2]), nf(r[3]), pct(r[4], 1)]), [1, 2, 3, 4]);
  c.append(el('p', 'muted', 'Tên không khớp nhiều nhất: ' + MR.unmatched.slice(0, 8).map(r => `${esc(r[1])} (${r[2]}, ${r[3]})`).join(', ') + ' → sai chính tả / tên cũ / tên quận, cần thêm quy tắc làm sạch.'));
  c = card(g, 'Đối chiếu ngày lễ của dim_date với BrasilAPI');
  table(c, ['Kết quả', 'Số ngày'], Object.entries(MR.holiday).map(([k, v]) => [esc(k), nf(v)]), [1]);
  insight(c, 'dim_date (tự tính bằng quy tắc Phục sinh) khớp toàn bộ ngày lễ của API; API có thêm Chủ nhật Phục sinh – vốn là ngày nghỉ cuối tuần.');
}

function pageJson() {
  title('Đơn hàng dạng tài liệu JSON lồng nhau – API đổi phiên bản từ 01/2018',
        '99.441 đơn thật được đóng gói lại thành JSON để mô phỏng webhook của sàn (giá trị thật, hình dạng mô phỏng) · mỗi tháng một file JSON Lines');
  const g = grid();
  let c = card(g, 'API v1 – đơn đặt trước 2018'); c.append(el('pre', '', esc(MR.v1)));
  c = card(g, 'API v2 – từ 01/2018: dời địa chỉ, thêm delivery{} và items[].product{}, tiền dạng chữ "31,90"'); c.append(el('pre', '', esc(MR.v2)));
  c = card(g, 'Lược đồ bảng silver/order_events qua từng lần nạp (mỗi điểm = một phiên bản Delta)', true);
  chart(c, { type: 'line', data: { labels: MR.sv.map(r => r[1].slice(7, 14)), datasets: [{ label: 'Số trường lá', data: MR.sv.map(r => r[4]), stepped: true, borderColor: C.blue,

function pageSentiment() {
  title('AI đọc cảm xúc bình luận – thử trực tiếp', `TF-IDF (từ + cụm 2 từ) + hồi quy logistic · học trên ${nf(M.n)} bình luận có sao · mô hình chạy ngay trong trình duyệt, không gửi dữ liệu đi đâu`);
  const g = grid();
  const c = card(g, 'Gõ một bình luận (tiếng Bồ Đào Nha) hoặc chọn ví dụ', true);
  const ta = el('textarea'); ta.placeholder = 'Ví dụ: O produto chegou antes do prazo, muito bom!'; c.append(ta);
  const ex = el('div', 'ex');
  M.examples.forEach(([t, vn]) => { const b = el('button', '', `${esc(t)}<small>${esc(vn)}</small>`); b.onclick = () => { ta.value = t; run(); }; ex.append(b); });
  c.append(ex);
  const out = el('div'); c.append(out);
  c.append(el('p', 'muted', `Kiểm tra: bản JavaScript ${SELFTEST ? 'cho đúng kết quả' : 'LỆCH so với'} bản Python (scikit-learn) trên các ví dụ. Từ không có trong từ điển của mô hình được bỏ qua.`));
  function run() {
    const t = ta.value.trim();
    if (!t) { out.innerHTML = ''; return; }
    const r = analyze(t), neg = r.p >= 0.5;
    const top = r.contrib.slice().sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 12);
    out.innerHTML = `<div class="verdict"><div class="big" style="color:${neg ? C.red : C.green}">${pct(r.p)}</div>
      <div><b>xác suất là lời chê</b> → AI kết luận: <b style="color:${neg ? C.red : C.green}">${neg ? 'TIÊU CỰC' : 'TÍCH CỰC'}</b><br>
      <span class="muted">Sau chuẩn hóa: “${esc(r.norm) || '–'}” · ${r.known} từ / cụm từ mô hình biết</span></div>
      <div class="gauge"><i style="left:calc(${(r.p * 100).toFixed(1)}% - 2px)"></i></div></div>
      <div class="chips">${top.map(([w, v]) => `<span class="chip ${v > 0 ? 'neg' : 'pos'}">${esc(w)}${GLOSS[w] ? ' (' + esc(GLOSS[w]) + ')' : ''} ${v > 0 ? '+' : ''}${nf(v, 2)}</span>`).join('')}</div>
      <p class="muted">Đỏ = đẩy về chê, xanh = đẩy về khen; con số là mức đóng góp của từ vào điểm của mô hình.</p>`;
  }
  ta.oninput = run;
  ta.value = M.examples[2][0]; run();

  const ai = MR.ai;
  let k = card(g, 'Kiểm tra trên bình luận từ 04/2018 (mô hình chưa từng thấy)');
  table(k, ['Cách làm', 'Đúng', 'Precision', 'Recall', 'F1 tiêu cực', 'AUC'],
        ai.metrics.map(r => [esc(r[0]), pct(r[1]), nf(r[2], 2), nf(r[3], 2), nf(r[4], 2), r[5] == null ? '–' : nf(r[5], 2)]), [1, 2, 3, 4, 5], (i, j) => i === 3 && j > 0 ? 'good' : '');
  insight(k, `AI hơn quy tắc 11 từ khóa ${nf((ai.metrics[3][1] - ai.metrics[1][1]) * 100)} điểm % độ chính xác; F1 lớp tiêu cực ${nf(ai.metrics[3][4], 2)} so với ${nf(ai.metrics[1][4], 2)}.`);
  k = card(g, 'Ma trận nhầm lẫn'); k.append(el('img', 'fit')); k.lastChild.src = 'mo_rong/charts/n7_sentiment_confusion.png'; k.lastChild.alt = 'Ma trận nhầm lẫn';
  k = card(g, 'Từ ngữ mô hình dùng để nhận ra lời chê / khen (trọng số)', true);
  const W = ai.words.filter(r => r[0] === 'Đẩy về tiêu cực').slice(0, 12).concat(ai.words.filter(r => r[0] === 'Đẩy về tích cực').slice(0, 12));
  chart(k, { type: 'bar', data: { labels: W.map(r => r[1] + (r[3] ? ' (' + r[3] + ')' : '')), datasets: [{ data: W.map(r => r[2]), backgroundColor: W.map(r => r[2] > 0 ? C.red : C.green) }] },
             options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { title: { display: true, text: 'trọng số (dương = chê, âm = khen)' } } } } }, true);
  k = card(g, 'Áp dụng cho mọi bình luận: số sao và lời viết có khớp không?');
  table(k, ['Số sao', 'Bình luận', 'AI: % chê', 'Khen sao, chê lời', 'Chê sao, khen lời'], ai.byscore.map(r => [r[0] + '★', nf(r[1]), pct(r[2]), nf(r[3]), nf(r[4])]), [1, 2, 3, 4]);
  insight(k, `${nf(ai.byscore.reduce((s, r) => s + r[3], 0))} bình luận 4–5 sao nhưng lời viết là chê → chăm sóc khách hàng liên hệ lại.`);
  k = card(g, 'Ví dụ "khen sao, chê lời" (đã che dữ liệu cá nhân)');
  table(k, ['Sao', 'AI: % chê', 'Bình luận'], ai.mismatch.map(r => [r[0] + '★', pct(r[1]), esc(r[2])]), [0, 1]);
}
